<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="HanaLima">
  <!-- Five petals = VMs, the core = the network that joins them. -->
  <defs>
    <linearGradient id="petal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5fa2"/>
      <stop offset="1" stop-color="#ff9ac6"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d7ff8a"/>
      <stop offset="1" stop-color="#8fdc3a"/>
    </radialGradient>
  </defs>
  <g transform="translate(32 32)">
    <g fill="url(#petal)">
      <rect x="-7" y="-28" width="14" height="18" rx="6"/>
      <rect x="-7" y="-28" width="14" height="18" rx="6" transform="rotate(72)"/>
      <rect x="-7" y="-28" width="14" height="18" rx="6" transform="rotate(144)"/>
      <rect x="-7" y="-28" width="14" height="18" rx="6" transform="rotate(216)"/>
      <rect x="-7" y="-28" width="14" height="18" rx="6" transform="rotate(288)"/>
    </g>
    <g stroke="#0b0d12" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-12"/>
      <line x1="0" y1="0" x2="0" y2="-12" transform="rotate(72)"/>
      <line x1="0" y1="0" x2="0" y2="-12" transform="rotate(144)"/>
      <line x1="0" y1="0" x2="0" y2="-12" transform="rotate(216)"/>
      <line x1="0" y1="0" x2="0" y2="-12" transform="rotate(288)"/>
    </g>
    <circle r="8" fill="url(#core)" stroke="#0b0d12" stroke-width="2"/>
  </g>
</svg>
